name: Python CI

on:
  push:
    branches: [ main ]
    paths:
      - 'python/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'python/**'
      - '.github/workflows/python-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-test:
    name: Lint, Format, Type-Check & Test on ${{ matrix.project }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [ 'fastapi-example', 'robyn-example' ]
        python-version: [ "3.12", "3.13", "3.14" ]

    defaults:
      run:
        working-directory: ./python/${{ matrix.project }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --locked --all-extras --dev

      - name: Code Formatting Check (Ruff)
        run: uv run ruff format --check .

      - name: Static Analysis & Linting (Ruff)
        run: uv run ruff check .

      - name: Type Checking (ty)
        run: uv run ty check .

      - name: Run Tests (pytest)
        run: uv run pytest -v
