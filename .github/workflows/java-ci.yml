name: Java CI

on:
  push:
    branches: [ main ]
    paths:
      - 'java/**'
      - '.github/workflows/java-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'java/**'
      - '.github/workflows/java-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build, Lint & Test (Java 21)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./java/spring-example

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Maven Clean Verify
        run: mvn clean verify --batch-mode --no-transfer-progress
